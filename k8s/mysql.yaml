apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-service
  template:
    metadata:
      labels:
        app: mysql-service
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "rootpass123"
            - name: MYSQL_DATABASE
              value: "recommendations_db"
            - name: MYSQL_USER
              value: "bankuser"
            - name: MYSQL_PASSWORD
              value: "bankpass"
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  type: ClusterIP
  selector:
    app: mysql-service
  ports:
    - port: 3306
      targetPort: 3306