apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
        - name: search
          image: <YOUR_ACR_NAME>.azurecr.io/search-service:v1
          ports:
            - containerPort: 8002
          env:
            - name: CORE_BANKING_URL
              value: "http://core-banking-service:8004"
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
spec:
  type: ClusterIP
  selector:
    app: search-service
  ports:
    - port: 8002
      targetPort: 8002