apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-portal-deployment
  labels:
    app: banking-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: banking-portal
  template:
    metadata:
      labels:
        app: banking-portal
    spec:
      containers:
        - name: banking-portal
          image: ayushbist/banking-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20