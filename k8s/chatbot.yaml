apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-service
  template:
    metadata:
      labels:
        app: chatbot-service
    spec:
      containers:
        - name: chatbot
          image: <YOUR_ACR_NAME>.azurecr.io/chatbot-service:v1
          ports:
            - containerPort: 8001
          env:
            - name: CORE_BANKING_URL
              value: "http://core-banking-service:8004"
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
spec:
  type: ClusterIP
  selector:
    app: chatbot-service
  ports:
    - port: 8001
      targetPort: 8001